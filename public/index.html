<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codex - 6Pro 额度复用助手</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    /* Codex native minimalist scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #e2e4e9; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #c5c8d0; }

    /* Codex Desktop Light Mode Typography */
    .codex-markdown {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 15px;
      line-height: 1.75;
      color: #1f2937;
      letter-spacing: 0.005em;
    }
    .codex-markdown h1 {
      font-size: 1.45rem;
      font-weight: 650;
      color: #111827;
      margin-top: 1.75rem;
      margin-bottom: 0.85rem;
      letter-spacing: -0.015em;
    }
    .codex-markdown h2 {
      font-size: 1.18rem;
      font-weight: 650;
      color: #111827;
      margin-top: 1.85rem;
      margin-bottom: 0.75rem;
      letter-spacing: -0.01em;
      border-bottom: 1px solid #f3f4f6;
      padding-bottom: 0.35rem;
    }
    .codex-markdown h3 {
      font-size: 1.02rem;
      font-weight: 600;
      color: #1f2937;
      margin-top: 1.4rem;
      margin-bottom: 0.5rem;
    }
    .codex-markdown p {
      margin-bottom: 1.2rem;
      color: #1f2937;
      line-height: 1.75;
    }
    .codex-markdown strong, .codex-markdown b {
      color: #111827;
      font-weight: 600;
      background: transparent !important;
      padding: 0 !important;
    }
    .codex-markdown em, .codex-markdown i {
      color: #4b5563;
      font-style: italic;
    }
    .codex-markdown :not(pre) > code {
      background: #f4f4f5;
      color: #09090b;
      padding: 0.12rem 0.4rem;
      border-radius: 0.3rem;
      font-size: 0.87em;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      border: 1px solid #e4e4e7;
    }
    .codex-markdown pre {
      background: #f8fafc !important;
      border: 1px solid #e2e8f0;
      border-radius: 0.55rem;
      padding: 1rem 1.15rem;
      margin: 1.15rem 0;
      overflow-x: auto;
    }
    .codex-markdown pre code {
      color: #1e293b;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.86rem;
      line-height: 1.62;
      background: transparent !important;
      padding: 0 !important;
      border: none !important;
    }
    .codex-markdown ul {
      list-style-type: disc;
      padding-left: 1.5rem;
      margin: 0.6rem 0 1.15rem 0;
    }
    .codex-markdown ol {
      list-style-type: decimal;
      padding-left: 1.5rem;
      margin: 0.6rem 0 1.15rem 0;
    }
    .codex-markdown li {
      margin-bottom: 0.4rem;
      color: #374151;
      line-height: 1.75;
    }
    .codex-markdown blockquote {
      border-left: 3px solid #d1d5db;
      padding: 0.5rem 1rem;
      margin: 1.15rem 0;
      color: #4b5563;
      background: #f9fafb;
      border-radius: 0 0.375rem 0.375rem 0;
    }
    .codex-markdown table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.25rem 0;
      font-size: 0.92rem;
      border: 1px solid #e5e7eb;
    }
    .codex-markdown th {
      background: #f9fafb;
      color: #111827;
      font-weight: 600;
      padding: 0.6rem 0.85rem;
      text-align: left;
      border: 1px solid #e5e7eb;
    }
    .codex-markdown td {
      padding: 0.55rem 0.85rem;
      border: 1px solid #e5e7eb;
      color: #374151;
    }
    .codex-markdown hr {
      border: 0;
      height: 1px;
      background: #f0f0f2;
      margin: 2rem 0;
    }

    /* Codex Tool Call & Stage Action items */
    .codex-action-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #71717a;
      margin: 14px 0;
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.4;
      user-select: text;
    }
    .codex-action-row code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      color: #52525b;
      background: transparent;
      padding: 0;
      border: none;
    }
    .codex-stage-divider {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11.5px;
      color: #a1a1aa;
      font-weight: 500;
      margin: 28px 0 16px 0;
      letter-spacing: 0.02em;
    }
    .codex-stage-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #f0f0f2;
    }

    /* User Message Bubble Typography */
    .codex-user-bubble {
      margin: 1.5rem 0;
    }
    .codex-user-body {
      font-size: 14.5px;
      line-height: 1.7;
      color: #0f172a;
    }
    .codex-user-body p {
      margin-bottom: 0.75rem;
      color: #0f172a;
    }
    .codex-user-body p:last-child {
      margin-bottom: 0;
    }
    .codex-user-body h1, .codex-user-body h2, .codex-user-body h3 {
      font-weight: 650;
      color: #09090b;
      margin-top: 1rem;
      margin-bottom: 0.4rem;
    }
    .codex-user-body ul, .codex-user-body ol {
      padding-left: 1.4rem;
      margin: 0.4rem 0 0.75rem 0;
    }
    .codex-user-body li {
      margin-bottom: 0.25rem;
      line-height: 1.6;
    }
    .codex-user-body pre {
      background: #ffffff !important;
      border: 1px solid #cbd5e1;
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      margin: 0.75rem 0;
    }
    .codex-user-body code {
      font-size: 0.88em;
    }

    /* Assistant Stage Report Bubble */
    .codex-assistant-bubble {
      margin: 1.5rem 0;
    }
    .codex-assistant-body {
      font-size: 14.5px;
      line-height: 1.75;
      color: #1e293b;
    }
  </style>
</head>
<body class="bg-[#f9f9fb] text-zinc-900 flex h-screen overflow-hidden font-sans select-none antialiased">

  <!-- Left Sidebar (Codex Desktop Natural Gray w-64) -->
  <aside class="w-64 bg-[#f9f9fb] border-r border-[#eaeaea] flex flex-col shrink-0 h-full select-none z-10">
    
    <!-- Codex Window Controls & Brand Header -->
    <div class="h-11 px-3.5 flex items-center justify-between border-b border-transparent">
      <div class="flex items-center gap-1.5 cursor-pointer hover:bg-zinc-200/50 px-1.5 py-1 rounded-md transition" title="Codex Desktop">
        <span class="font-semibold text-[13.5px] text-zinc-800 tracking-tight">Codex</span>
        <svg class="w-3.5 h-3.5 text-zinc-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </div>

      <div class="flex items-center gap-0.5 text-zinc-500">
      </div>
    </div>

    <!-- Single Clear New Session Button -->
    <div class="px-3 py-2">
      <button id="btnNewDraftChat" class="w-full flex items-center justify-center gap-2 px-3 py-2 rounded-lg bg-zinc-900 hover:bg-black text-white text-[13px] font-medium transition shadow-sm select-none" title="创建并切换到一个全新的会话">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 4v16m8-8H4" />
        </svg>
        <span>新建会话</span>
      </button>
    </div>

    <!-- Section: Recents / Sessions List -->
    <div class="px-3 pt-2 pb-1 flex items-center justify-between text-[11px] font-medium text-zinc-400 select-none">
      <span class="tracking-wide">会话列表</span>
    </div>
    <div id="sessionList" class="max-h-48 overflow-y-auto px-2 py-0.5 space-y-0.5 text-xs">
      <!-- Dynamic session items injected here -->
    </div>

    <!-- Section Divider & Header: Current Tasks -->
    <div class="px-3 pt-3 pb-1 flex items-center justify-between text-[11px] font-medium text-zinc-400 select-none border-t border-[#eaeaea] mt-1">
      <div class="flex items-center gap-1.5">
        <span class="tracking-wide">当前待办队列</span>
        <span id="taskCountBadge" class="text-[10px] px-1.5 py-0.2 rounded-full bg-zinc-200/70 text-zinc-600 font-mono font-medium">0</span>
      </div>
      <button id="btnClearTasks" class="hover:text-zinc-700 transition" title="清空待办任务">清空</button>
    </div>

    <!-- Task List (TASKS.txt) -->
    <div id="taskList" class="flex-1 overflow-y-auto px-2 py-1 space-y-1 text-xs">
      <div class="text-zinc-400 italic text-center py-6 text-[12px]">队列已空<br>等待新任务</div>
    </div>

    <!-- Bottom Profile & Workspace Footer -->
    <div class="border-t border-[#eaeaea] p-2.5 flex items-center justify-between bg-[#f9f9fb] text-xs">
      <div id="workspaceBtn" class="flex items-center gap-2 min-w-0 cursor-pointer hover:bg-zinc-200/60 p-1.5 rounded-md transition flex-1 mr-1" title="点击切换工作区路径">
        <div class="w-5 h-5 rounded-full bg-zinc-200 flex items-center justify-center text-[10px] text-zinc-600 shrink-0 font-medium">📁</div>
        <span id="workspacePath" class="truncate text-zinc-700 text-[11.5px] font-mono">加载中...</span>
      </div>
      <div class="flex items-center gap-1 shrink-0">
        <button id="btnChangeWorkspace" class="p-1 rounded text-zinc-400 hover:text-zinc-700 hover:bg-zinc-200/60 transition" title="更改工作区">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- Right Main Area (Pure White Background, Centered Column, Floating Input) -->
  <main class="flex-1 flex flex-col bg-white relative overflow-hidden h-full">
    
    <!-- Top Minimalist Bar (Codex Style) -->
    <header class="h-11 border-b border-[#f0f0f2] px-6 flex items-center justify-between shrink-0 bg-white select-none z-10">
      <!-- Session Title / Prompt snippet -->
      <div class="flex items-center gap-2.5 min-w-0 max-w-lg">
        <span id="activeSessionBadge" class="text-[11px] font-mono px-2 py-0.5 rounded bg-zinc-100 text-zinc-600 border border-zinc-200 shrink-0 select-none">default</span>
        <span id="activeTitle" class="text-[13.5px] font-medium text-zinc-800 truncate">默认会话</span>
      </div>

      <!-- Right Action Icons -->
      <div class="flex items-center gap-3 text-zinc-500 text-xs shrink-0">
        <div id="agentStatusBadge" class="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-zinc-100 text-zinc-600 border border-zinc-200/80 transition-all duration-300 select-none" title="模型运行与等待状态">
          <span id="agentStatusDot" class="w-2 h-2 rounded-full bg-zinc-400"></span>
          <span id="agentStatusLabel">检测中...</span>
        </div>
        <button id="btnCopyPrompt" class="px-2.5 py-1 rounded-md hover:bg-zinc-100 hover:text-zinc-800 text-zinc-600 text-xs transition flex items-center gap-1.5 font-medium shrink-0 whitespace-nowrap" title="复制提示词">
          <span>📋 复制启动词</span>
        </button>
        <button id="btnClearResponse" class="p-1.5 rounded-md hover:bg-zinc-100 hover:text-zinc-800 text-zinc-400 transition shrink-0" title="清空汇报历史">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Scrollable Chat Stream (RESPONSE.md) -->
    <div id="responseScrollArea" class="flex-1 overflow-y-auto relative select-text">
      <!-- Centered Reading Column (max-w-[780px], ample bottom padding for floating input) -->
      <div id="responseContainer" class="max-w-[780px] w-full mx-auto px-6 pt-7 pb-48 codex-markdown">
        <div class="text-zinc-400 italic text-center py-20 text-sm">等待 6pro 产生第一阶段汇报...</div>
      </div>
    </div>

    <!-- Floating Codex Input Pill (Absolute at Bottom, Centered, Big Rounded Pill) -->
    <div class="absolute bottom-0 left-0 right-0 pointer-events-none flex justify-center px-4 pb-5 pt-10 bg-gradient-to-t from-white via-white/80 to-transparent z-20">
      <div class="pointer-events-auto w-full max-w-[780px] bg-white border border-zinc-200/90 rounded-[24px] shadow-[0_4px_24px_rgba(0,0,0,0.06),0_1px_3px_rgba(0,0,0,0.03)] px-4 py-2.5 flex flex-col gap-1.5 transition-all duration-150 focus-within:border-zinc-350 focus-within:shadow-[0_8px_30px_rgba(0,0,0,0.08)]">
        
        <!-- Image Preview Area -->
        <div id="imagePreviewArea" class="hidden flex items-center gap-2 pb-1.5 flex-wrap"></div>

        <!-- Textarea (随心输入) -->
        <textarea id="taskInput" rows="2" placeholder="随心输入新任务或向 6Pro 补充指令... (支持 Ctrl+V 粘贴图片，按 Enter 发送)" class="w-full bg-transparent border-none p-0 text-[14.5px] text-zinc-900 placeholder:text-zinc-400 focus:outline-none focus:ring-0 resize-none leading-relaxed min-h-[42px] max-h-36"></textarea>

        <!-- Bottom Row Inside Pill: Left Tools & Badges, Right Model & Send/Stop Button -->
        <div class="flex items-center justify-between pt-1 select-none">
          <!-- Left: + Button and Status Pill -->
          <div class="flex items-center gap-2">
            <input type="file" id="imageFileInput" accept="image/*" class="hidden" />
            <button id="btnAttach" class="w-7 h-7 rounded-full text-zinc-500 hover:bg-zinc-100 hover:text-zinc-800 flex items-center justify-center transition" title="上传本地图片">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 4v16m8-8H4" />
              </svg>
            </button>
            
            <!-- Exact Codex "完全访问" Orange Pill -->
            <div class="flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-[#fef7ee] border border-[#fed7aa]/70 text-[11.5px] font-medium text-[#c2410c]" title="单轮多任务环境，自动复用会话">
              <svg class="w-3.5 h-3.5 text-[#ea580c]" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
              </svg>
              <span>完全访问 · 单轮复用</span>
            </div>

            <!-- Finish Turn Quick Action -->
            <button id="btnFinishTurn" class="text-[11.5px] text-zinc-400 hover:text-rose-600 px-2 py-0.5 rounded hover:bg-rose-50 transition" title="发送 /exit 结束当前轮次">
              结束本轮 (/exit)
            </button>
          </div>

          <!-- Right: Model Indicator & Black Circular Button -->
          <div class="flex items-center gap-3">
            <div class="flex items-center gap-1.5 text-xs text-zinc-400 font-sans">
              <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
              <span>ChatGPT Web — High 轻度</span>
            </div>

            <!-- Native Codex Black Circle Send Button -->
            <button id="btnSendTask" class="w-8 h-8 rounded-full bg-zinc-900 hover:bg-black text-white flex items-center justify-center transition shadow-sm active:scale-95 disabled:opacity-40" title="发送 (Enter)">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 10l7-7m0 0l7 7m-7-7v18" />
              </svg>
            </button>
          </div>
        </div>

      </div>
    </div>

  </main>

  <script>
    marked.setOptions({ gfm: true, breaks: true });
    const elWorkspace = document.getElementById("workspacePath");
    const elSessionList = document.getElementById("sessionList");
    const elActiveSessionBadge = document.getElementById("activeSessionBadge");
    const elTaskList = document.getElementById("taskList");
    const elTaskBadge = document.getElementById("taskCountBadge");
    const elResponse = document.getElementById("responseContainer");
    const elResponseScrollArea = document.getElementById("responseScrollArea");
    const elInput = document.getElementById("taskInput");
    const btnSend = document.getElementById("btnSendTask");
    const btnClearTasks = document.getElementById("btnClearTasks");
    const btnClearResponse = document.getElementById("btnClearResponse");
    const btnChangeWs = document.getElementById("btnChangeWorkspace");
    const workspaceBtn = document.getElementById("workspaceBtn");
    const btnCopyPrompt = document.getElementById("btnCopyPrompt");
    const btnFinishTurn = document.getElementById("btnFinishTurn");
    const btnNewTurn = document.getElementById("btnNewTurn");
    const btnNewDraftChat = document.getElementById("btnNewDraftChat");
    const btnCreateSession = document.getElementById("btnCreateSession");
    const activeTitle = document.getElementById("activeTitle");

    let activeSessionId = localStorage.getItem("6pro_active_session") || "default";
    let isDraftNewSession = false;
    let lastEpoch = 0;
    let currentSessionsCache = [];
    const sessionBus = window.BroadcastChannel ? new BroadcastChannel("6pro_session_bus") : null;

    // Auto-expand textarea height gracefully
    elInput.addEventListener("input", () => {
      elInput.style.height = "auto";
      elInput.style.height = Math.min(elInput.scrollHeight, 140) + "px";
    });

    function escapeHtml(str) {
      return (str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function formatAssistantBody(text) {
      if (!text || !text.trim()) return "";
      const lines = text.split(/\r?\n/);
      const processedLines = [];

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();

        // 1. Command execution: 已运行 Get-Content...
        if (line.startsWith("已运行 ")) {
          const cmd = line.substring(4);
          processedLines.push(`\n<div class="codex-action-row"><svg class="w-4 h-4 text-zinc-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m7 10 3 2-3 2M13 14h4"/></svg><span>已运行 <code>${escapeHtml(cmd)}</code></span></div>\n`);
          continue;
        }

        // 2. File read: 已读取 TASKS.txt
        if (line.startsWith("已读取 ")) {
          const file = line.substring(4);
          processedLines.push(`\n<div class="codex-action-row"><svg class="w-4 h-4 text-zinc-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8M16 17H8M10 9H8"/></svg><span>已读取 <code>${escapeHtml(file)}</code></span></div>\n`);
          continue;
        }

        // 3. Web search: 已搜索 ...
        if (line.startsWith("已搜索 ")) {
          const query = line.substring(4);
          processedLines.push(`\n<div class="codex-action-row"><svg class="w-4 h-4 text-zinc-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20M2 12h20"/></svg><span>已搜索 ${escapeHtml(query)}</span></div>\n`);
          continue;
        }

        processedLines.push(lines[i]);
      }

      return marked.parse(processedLines.join("\n"));
    }

    // Native Codex Tool Call, Stage Divider & User Message Formatter
    function renderCodexContent(rawMarkdown) {
      if (!rawMarkdown || !rawMarkdown.trim()) {
        return '<div class="text-zinc-400 italic text-center py-20 text-sm">等待 6pro 产生第一阶段汇报...</div>';
      }

      const sections = rawMarkdown.split(/(?=^###\s*(?:用户任务|阶段汇报))/m);
      const htmlParts = [];

      for (const sec of sections) {
        const trimmed = sec.trim();
        if (!trimmed) continue;

        const match = trimmed.match(/^###\s*(用户任务|阶段汇报)\s*\[?([0-9:]*)\]?/);
        if (match) {
          const type = match[1];
          const time = match[2] || "";
          const body = trimmed.substring(match[0].length).trim();

          if (type === "用户任务") {
            const parsedBody = marked.parse(body);
            htmlParts.push(`
              <div class="codex-user-turn my-8 flex justify-end">
                <div class="max-w-[92%] sm:max-w-[85%] w-full bg-[#f4f4f6] border border-[#e4e4e7] rounded-2xl px-5 py-4 shadow-sm transition hover:border-[#d4d4d8]">
                  <div class="flex items-center justify-between gap-4 text-xs mb-2.5 pb-2 border-b border-zinc-200/70 font-sans">
                    <div class="flex items-center gap-2">
                      <div class="w-5 h-5 rounded-full bg-zinc-900 text-white flex items-center justify-center text-[10px] font-semibold shadow-xs">我</div>
                      <span class="font-medium text-zinc-800 text-[13px]">用户任务</span>
                    </div>
                    ${time ? `<span class="font-mono text-[11px] text-zinc-400 font-normal">${escapeHtml(time)}</span>` : ''}
                  </div>
                  <div class="codex-user-body text-[14.5px] text-zinc-800 leading-relaxed font-normal select-text">
                    ${parsedBody}
                  </div>
                </div>
              </div>
            `);
            continue;
          }

          if (type === "阶段汇报") {
            const divider = `
              <div class="codex-stage-divider">
                <svg class="w-3.5 h-3.5 text-zinc-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span>阶段汇报 ${escapeHtml(time)}</span>
              </div>
            `;
            htmlParts.push(divider + formatAssistantBody(body));
            continue;
          }
        }

        htmlParts.push(formatAssistantBody(trimmed));
      }

      return htmlParts.join("\n");
    }

    function copyResumePrompt(text, btnEl) {
      if (!text) text = "请在当前会话中继续调用 codex_fetch_next_task 领取待办任务并执行。";
      navigator.clipboard.writeText(text).then(() => {
        if (btnEl) {
          const orig = btnEl.innerHTML;
          btnEl.innerHTML = "<span>✅ 续接词已复制！去网页端粘贴</span>";
          btnEl.classList.remove("bg-amber-600", "hover:bg-amber-700");
          btnEl.classList.add("bg-emerald-600", "hover:bg-emerald-700");
          setTimeout(() => {
            btnEl.innerHTML = orig;
            btnEl.classList.remove("bg-emerald-600", "hover:bg-emerald-700");
            btnEl.classList.add("bg-amber-600", "hover:bg-amber-700");
          }, 3000);
        } else {
          alert("✅ 续接指令已复制到剪贴板！请直接前往 ChatGPT 原网页粘贴发送。");
        }
      });
    }
    window.copyResumePrompt = copyResumePrompt;

    // Render Session List in Sidebar
    function renderSessions(sessions) {
      if (!sessions) return;
      currentSessionsCache = sessions;
      elSessionList.innerHTML = sessions.map(sess => {
        const isActive = !isDraftNewSession && sess.id === activeSessionId;
        return `
          <div class="group flex items-center justify-between px-2.5 py-1.5 rounded-md cursor-pointer transition ${isActive ? 'bg-zinc-200/80 text-zinc-900 font-medium' : 'text-zinc-600 hover:bg-zinc-200/40 hover:text-zinc-900'}" onclick="selectSession('${escapeHtml(sess.id)}')">
            <div class="flex items-center gap-2 min-w-0 flex-1">
              <svg class="w-3.5 h-3.5 text-zinc-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
              </svg>
              <span class="truncate text-[12.5px]">${escapeHtml(sess.name || sess.id)}</span>

            <div class="flex items-center gap-1 shrink-0 opacity-0 group-hover:opacity-100 transition">
              <button class="p-0.5 hover:text-zinc-900 rounded" onclick="event.stopPropagation(); renameSessionPrompt('${escapeHtml(sess.id)}', '${escapeHtml(sess.name || '')}')" title="重命名">✏️</button>
              ${sess.id !== 'default' ? `<button class="p-0.5 hover:text-rose-600 rounded" onclick="event.stopPropagation(); deleteSessionConfirm('${escapeHtml(sess.id)}')" title="删除会话">🗑️</button>` : ''}
            </div>
            ${sess.taskCount > 0 ? `<span class="text-[10px] px-1.5 py-0.2 rounded-full bg-zinc-200/70 text-zinc-600 font-mono ml-1 shrink-0">${sess.taskCount}</span>` : ''}
          </div>

    function updateUI(data) {
      if (data.workspace) {
        elWorkspace.textContent = data.workspace;
      }

      if (data.sessions) {
        renderSessions(data.sessions);
      }

      if (isDraftNewSession) return;

      // Update badge and title
      const currentMeta = currentSessionsCache.find(s => s.id === activeSessionId);
      elActiveSessionBadge.textContent = activeSessionId;
      elActiveSessionBadge.className = "text-[11px] font-mono px-2 py-0.5 rounded bg-zinc-100 text-zinc-600 border border-zinc-200 shrink-0 select-none";

      if (data.tasks && data.tasks.length > 0) {
        activeTitle.textContent = `执行中: ${data.tasks[0]}`;
      } else {
        activeTitle.textContent = currentMeta ? currentMeta.name : (activeSessionId === "default" ? "默认会话" : activeSessionId);
      }

      // Update copy button text
      const sName = currentMeta ? currentMeta.name : (activeSessionId === "default" ? "默认会话" : activeSessionId);
      btnCopyPrompt.innerHTML = `<span>📋 复制【${escapeHtml(sName.slice(0, 10))}】启动词</span>`;

      // Render tasks in left sidebar
      const tasks = data.tasks || [];
      elTaskBadge.textContent = tasks.length;
      if (tasks.length === 0) {
        elTaskList.innerHTML = '<div class="text-zinc-400 italic text-center py-6 text-[12px]">队列已空<br>等待新任务</div>';
      } else {
        elTaskList.innerHTML = tasks.map((task, idx) => `
          <div class="group flex items-start gap-2.5 px-2.5 py-2 rounded-lg text-xs text-zinc-700 hover:bg-zinc-200/50 transition cursor-default">
            <span class="font-mono text-zinc-400 text-[11px] shrink-0 mt-0.5">#${idx + 1}</span>
            <span class="flex-1 line-clamp-2 leading-relaxed text-zinc-800 break-words select-text font-normal">${escapeHtml(task)}</span>
          </div>
        `).join("");
      }

      // Update Agent Status Badge
      updateAgentStatusBadge(data.agentStatus);

      // Render response
      const wasAtBottom = elResponseScrollArea.scrollHeight - elResponseScrollArea.scrollTop <= elResponseScrollArea.clientHeight + 100;
      let contentHtml = "";
      if (data.response && data.response.trim()) {
        contentHtml = renderCodexContent(data.response);
      } else {
        contentHtml = '<div class="text-zinc-400 italic text-center py-20 text-sm">等待 6pro 产生第一阶段汇报...</div>';
      }

      // Append real-time status card at bottom of conversation
      const cardHtml = renderStatusCard(data.agentStatus);
      elResponse.innerHTML = contentHtml + cardHtml;

      elResponse.querySelectorAll('pre code').forEach((block) => {
        try { hljs.highlightElement(block); } catch {}
      });

      if (wasAtBottom) {
        elResponseScrollArea.scrollTop = elResponseScrollArea.scrollHeight;
      }
    }

    // Switch active session
    window.selectSession = async function(sessId) {
      if (isDraftNewSession) isDraftNewSession = false;
      activeSessionId = sessId;
      localStorage.setItem("6pro_active_session", sessId);
      connectSSE(sessId);
      try {
        await fetch("/api/sessions/switch", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessId }),
        });
        const res = await fetch(`/api/info?session_id=${encodeURIComponent(sessId)}`);
        const data = await res.json();
        updateUI(data);
      } catch {}
      if (sessionBus) sessionBus.postMessage({ type: "SESSION_SWITCHED", sessionId: sessId });
    };

    // Create and select new session immediately
    async function createAndSelectNewSession() {
      const newId = `sess_${Date.now().toString(36)}`;
      try {
        await fetch("/api/sessions/create", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: newId, name: "新会话" }),
        });
        await selectSession(newId);
        elInput.focus();
      } catch (err) {
        alert("创建新会话失败: " + err.message);
      }
    }

    window.renameSessionPrompt = async function(id, oldName) {
      const newName = prompt("请输入新会话名称：", oldName);
      if (newName && newName.trim() && newName.trim() !== oldName) {
        await fetch("/api/sessions/rename", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id, name: newName.trim() }),
        });
      }
    };

    window.deleteSessionConfirm = async function(id) {
      if (confirm(`确认删除会话 [${id}] 吗？`)) {
        await fetch("/api/sessions/delete", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id }),
        });
        if (activeSessionId === id) {
          selectSession("default");
        }
      }
    };

    // SSE Connection for instant real-time updates
    let evtSource = null;
    function connectSSE(sessionId) {
      if (evtSource) {
        evtSource.close();
      }
      evtSource = new EventSource(`/api/events?session_id=${encodeURIComponent(sessionId)}`);
      evtSource.onmessage = (e) => {
        try {
          const data = JSON.parse(e.data);
          if (data.epoch && data.epoch < lastEpoch) return;
          if (data.epoch) lastEpoch = data.epoch;
          updateUI(data);
        } catch {}
      };
    }
    connectSSE(activeSessionId);
    fetch("/api/sessions/switch", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: activeSessionId }),
    }).catch(() => {});

    // Send task
    async function submitTask() {
      const text = elInput.value.trim();
      if (!text) return;
      elInput.value = "";
      elInput.style.height = "auto";

      await fetch("/api/add-task", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ task: text, session_id: activeSessionId }),
      });
    }

    btnSend.addEventListener("click", submitTask);
    elInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        submitTask();
      }
    });

    btnNewDraftChat.addEventListener("click", createAndSelectNewSession);

    // Clear buttons
    btnClearTasks.addEventListener("click", async () => {
      if (confirm(`确认清空会话 [${activeSessionId}] 的待办任务队列？`)) {
        await fetch("/api/clear-tasks", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: activeSessionId }),
        });
      }
    });

    btnFinishTurn.addEventListener("click", async () => {
      if (confirm(`确认结束会话 [${activeSessionId}] 的本轮交互并让 6pro 进行最终收尾交付？`)) {
        await fetch("/api/add-task", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ task: "/exit", session_id: activeSessionId }),
        });
      }
    });

    btnClearResponse.addEventListener("click", async () => {
      if (confirm(`确认清空会话 [${activeSessionId}] 的历史汇报？`)) {
        await fetch("/api/clear-response", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: activeSessionId }),
        });
      }
    });

    // Image upload & clipboard paste handling
    const elImageFileInput = document.getElementById("imageFileInput");
    const elImagePreviewArea = document.getElementById("imagePreviewArea");
    const btnAttach = document.getElementById("btnAttach");

    btnAttach.addEventListener("click", () => {
      elImageFileInput.click();
    });

    elImageFileInput.addEventListener("change", (e) => {
      if (e.target.files && e.target.files[0]) {
        uploadAndAttachImage(e.target.files[0]);
        elImageFileInput.value = "";
      }
    });

    // Window-level Paste event listener for screenshots / images
    window.addEventListener("paste", (e) => {
      const items = (e.clipboardData || window.clipboardData)?.items;
      if (!items) return;
      for (const item of items) {
        if (item.type && item.type.startsWith("image/")) {
          const file = item.getAsFile();
          if (file) {
            e.preventDefault();
            uploadAndAttachImage(file);
            break;
          }
        }
      }
    });

    async function uploadAndAttachImage(file) {
      const reader = new FileReader();
      reader.onload = async () => {
        const base64 = reader.result;
        const tempId = "img_" + Date.now();
        elImagePreviewArea.classList.remove("hidden");
        const badge = document.createElement("div");
        badge.id = tempId;
        badge.className = "flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-zinc-100 border border-zinc-200 text-xs text-zinc-700 animate-pulse";
        badge.innerHTML = `<span class="inline-block w-2 h-2 rounded-full bg-amber-500 animate-ping"></span><span>正在保存图片...</span>`;
        elImagePreviewArea.appendChild(badge);

        try {
          const res = await fetch("/api/upload-image", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              image: base64,
              session_id: activeSessionId,
              filename: file.name || "pasted_image.png"
            })
          });
          const data = await res.json();
          if (data.success && data.path) {
            badge.className = "flex items-center gap-2 px-2.5 py-1 rounded-lg bg-zinc-50 border border-zinc-200 text-xs text-zinc-700 shadow-sm";
            badge.innerHTML = `
              <img src="${base64}" class="w-5 h-5 rounded object-cover border border-zinc-300" />
              <span class="font-mono text-[11px] text-zinc-600 truncate max-w-[180px]">${data.filename}</span>
              <button class="text-zinc-400 hover:text-rose-600 font-bold ml-1" title="移除图片">&times;</button>
            `;
            badge.querySelector("button").onclick = () => {
              badge.remove();
              if (!elImagePreviewArea.children.length) elImagePreviewArea.classList.add("hidden");
              elInput.value = elInput.value.replace(`【图片: ${data.path}】`, "").trim();
            };

            const tag = `【图片: ${data.path}】`;
            if (!elInput.value.includes(data.path)) {
              elInput.value = (tag + " " + elInput.value).trim();
              elInput.focus();
            }
          } else {
            badge.remove();
            if (!elImagePreviewArea.children.length) elImagePreviewArea.classList.add("hidden");
            alert("图片上传失败: " + (data.error || "未知错误"));
          }
        } catch (err) {
          badge.remove();
          if (!elImagePreviewArea.children.length) elImagePreviewArea.classList.add("hidden");
          alert("图片处理失败: " + err.message);
        }
      };
      reader.readAsDataURL(file);
    }

    // Change workspace
    async function changeWorkspacePrompt() {
      const target = prompt("输入工作区文件夹绝对路径：", elWorkspace.textContent);
      if (target && target.trim()) {
        await fetch("/api/set-workspace", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ workspace: target.trim() }),
        });
      }
    }
    btnChangeWs.addEventListener("click", changeWorkspacePrompt);
    workspaceBtn.addEventListener("click", changeWorkspacePrompt);

    // Copy Prompt (Session tailored)
    btnCopyPrompt.addEventListener("click", () => {
      const currentMeta = (currentSessionsCache || []).find(s => s.id === activeSessionId);
      const sessionName = currentMeta ? currentMeta.name : (activeSessionId === "default" ? "默认会话" : activeSessionId);
      const promptText = `你当前已绑定本地会话【${sessionName}】（Session ID: ${activeSessionId}）。\n` +
        `专属工作区会话目录：sessions/${activeSessionId}/\n\n` +
        `【工作流与心跳保活协议】\n` +
        `1. 任务领取与心跳保活：必须通过 MCP 工具 codex_fetch_next_task 与本地通信。\n` +
        `   - 调用参数：传入 session_id="${activeSessionId}"（若你本地工具列表未声明 session_id 参数，请直接调用，无需传参，本地会自动关联此会话）。\n` +
        `   - 示例：codex_fetch_next_task(session_id="${activeSessionId}", step_summary="会话已建立，开始等待任务")。\n` +
        `2. 保持会话常驻轮询（关键禁令）：\n` +
        `   - 如果返回的 next_task 是 '__POLL__'，说明用户暂无新指令、正在本地编辑任务。\n` +
        `   - 【硬性要求】：严禁向用户输出任何解释文字或结束语，必须立刻再次调用 codex_fetch_next_task 保持静默等待。\n` +
        `   - 只要 has_next 为 true，绝对严禁结束对话，必须依靠循环调用工具保持心跳保活常驻！\n` +
        `3. 阶段汇报要求：拿到真实任务后全力执行；每完成一项任务，把完整成果报告填入 step_summary，并调用 codex_fetch_next_task(session_id="${activeSessionId}", step_summary="...") 提交汇报并领取下一项任务。\n` +
        `4. 终结退出通道：只有当 codex_fetch_next_task 返回 has_next=false（用户显式输入 /exit）时，才做最终汇报并结束本轮（若存在 codex_turn_complete 则调用，无则直接输出最终结论）。\n` +
        `5. 会话隔离安全：所有临时执行脚本、日志与测试请在 work/${activeSessionId}/ 或对应工程工作区下进行。\n\n` +
        `现在请立即调用 codex_fetch_next_task(session_id="${activeSessionId}", step_summary="会话已建立，开始等待任务") 领取第一个任务！`;
      navigator.clipboard.writeText(promptText).then(() => {
        const orig = btnCopyPrompt.innerHTML;
        btnCopyPrompt.innerHTML = `<span>✅ 已复制【${escapeHtml(sessionName.slice(0, 10))}】启动词</span>`;
        setTimeout(() => btnCopyPrompt.innerHTML = orig, 2500);
      });
    });

    if (sessionBus) {
      sessionBus.onmessage = (e) => {
        if (e.data && e.data.type === "SESSION_SWITCHED") {
          fetch(`/api/sessions`).then(r => r.json()).then(d => renderSessions(d.sessions));
        }
      };
    }
  </script>
</body>
</html>
