<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Codex - 6Pro 额度复用助手</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    /* Codex native minimalist scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #e2e4e9; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #c5c8d0; }

    /* Codex Desktop Light Mode Typography */
    .codex-markdown {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 15px;
      line-height: 1.75;
      color: #1f2937;
      letter-spacing: 0.005em;
    }
    .codex-markdown h1 {
      font-size: 1.45rem;
      font-weight: 650;
      color: #111827;
      margin-top: 1.75rem;
      margin-bottom: 0.85rem;
      letter-spacing: -0.015em;
    }
    .codex-markdown h2 {
      font-size: 1.18rem;
      font-weight: 650;
      color: #111827;
      margin-top: 1.85rem;
      margin-bottom: 0.75rem;
      letter-spacing: -0.01em;
      border-bottom: 1px solid #f3f4f6;
      padding-bottom: 0.35rem;
    }
    .codex-markdown h3 {
      font-size: 1.02rem;
      font-weight: 600;
      color: #1f2937;
      margin-top: 1.4rem;
      margin-bottom: 0.5rem;
    }
    .codex-markdown p {
      margin-bottom: 1.2rem;
      color: #1f2937;
      line-height: 1.75;
    }
    .codex-markdown strong, .codex-markdown b {
      color: #111827;
      font-weight: 600;
      background: transparent !important;
      padding: 0 !important;
    }
    .codex-markdown em, .codex-markdown i {
      color: #4b5563;
      font-style: italic;
    }
    .codex-markdown :not(pre) > code {
      background: #f4f4f5;
      color: #09090b;
      padding: 0.12rem 0.4rem;
      border-radius: 0.3rem;
      font-size: 0.87em;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      border: 1px solid #e4e4e7;
    }
    .codex-markdown pre {
      background: #f8fafc !important;
      border: 1px solid #e2e8f0;
      border-radius: 0.55rem;
      padding: 1rem 1.15rem;
      margin: 1.15rem 0;
      overflow-x: auto;
    }
    .codex-markdown pre code {
      color: #1e293b;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.86rem;
      line-height: 1.62;
      background: transparent !important;
      padding: 0 !important;
      border: none !important;
    }
    .codex-markdown ul {
      list-style-type: disc;
      padding-left: 1.5rem;
      margin: 0.6rem 0 1.15rem 0;
    }
    .codex-markdown ol {
      list-style-type: decimal;
      padding-left: 1.5rem;
      margin: 0.6rem 0 1.15rem 0;
    }
    .codex-markdown li {
      margin-bottom: 0.4rem;
      color: #374151;
      line-height: 1.75;
    }
    .codex-markdown blockquote {
      border-left: 3px solid #d1d5db;
      padding: 0.5rem 1rem;
      margin: 1.15rem 0;
      color: #4b5563;
      background: #f9fafb;
      border-radius: 0 0.375rem 0.375rem 0;
    }
    .codex-markdown table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.25rem 0;
      font-size: 0.92rem;
      border: 1px solid #e5e7eb;
    }
    .codex-markdown th {
      background: #f9fafb;
      color: #111827;
      font-weight: 600;
      padding: 0.6rem 0.85rem;
      text-align: left;
      border: 1px solid #e5e7eb;
    }
    .codex-markdown td {
      padding: 0.55rem 0.85rem;
      border: 1px solid #e5e7eb;
      color: #374151;
    }
    .codex-markdown hr {
      border: 0;
      height: 1px;
      background: #f0f0f2;
      margin: 2rem 0;
    }

    /* Codex Tool Call & Stage Action items */
    .codex-action-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #71717a;
      margin: 14px 0;
      font-family: system-ui, -apple-system, sans-serif;
      line-height: 1.4;
      user-select: text;
    }
    .codex-action-row code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      color: #52525b;
      background: transparent;
      padding: 0;
      border: none;
    }
    .codex-stage-divider {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11.5px;
      color: #a1a1aa;
      font-weight: 500;
      margin: 28px 0 16px 0;
      letter-spacing: 0.02em;
    }
    .codex-stage-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #f0f0f2;
    }

    /* User Message Bubble Typography */
    .codex-user-bubble {
      margin: 1.5rem 0;
    }
    .codex-user-body {
      font-size: 14.5px;
      line-height: 1.7;
      color: #0f172a;
    }
    .codex-user-body p {
      margin-bottom: 0.75rem;
      color: #0f172a;
    }
    .codex-user-body p:last-child {
      margin-bottom: 0;
    }
    .codex-user-body h1, .codex-user-body h2, .codex-user-body h3 {
      font-weight: 650;
      color: #09090b;
      margin-top: 1rem;
      margin-bottom: 0.4rem;
    }
    .codex-user-body ul, .codex-user-body ol {
      padding-left: 1.4rem;
      margin: 0.4rem 0 0.75rem 0;
    }
    .codex-user-body li {
      margin-bottom: 0.25rem;
      line-height: 1.6;
    }
    .codex-user-body pre {
      background: #ffffff !important;
      border: 1px solid #cbd5e1;
      border-radius: 0.5rem;
      padding: 0.75rem 1rem;
      margin: 0.75rem 0;
    }
    .codex-user-body code {
      font-size: 0.88em;
    }

    /* Assistant Stage Report Bubble */
    .codex-assistant-bubble {
      margin: 1.5rem 0;
    }
    .codex-assistant-body {
      font-size: 14.5px;
      line-height: 1.75;
      color: #1e293b;
    }
  </style>
</head>
<body class="bg-[#f9f9fb] text-zinc-900 flex h-screen overflow-hidden font-sans select-none antialiased">

  <!-- Left Sidebar (Codex Desktop Natural Gray w-64) -->
  <aside class="w-64 bg-[#f9f9fb] border-r border-[#eaeaea] flex flex-col shrink-0 h-full select-none z-10">
    
    <!-- Codex Window Controls & Brand Header -->
    <div class="h-11 px-3.5 flex items-center justify-between border-b border-transparent">
      <div class="flex items-center gap-1.5 cursor-pointer hover:bg-zinc-200/50 px-1.5 py-1 rounded-md transition" title="Codex Desktop">
        <span class="font-semibold text-[13.5px] text-zinc-800 tracking-tight">Codex</span>
        <svg class="w-3.5 h-3.5 text-zinc-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </div>

      <div class="flex items-center gap-0.5 text-zinc-500">
      </div>
    </div>

    <!-- Single Clear New Session Button -->
    <div class="px-3 py-2">
      <button id="btnNewDraftChat" class="w-full flex items-center justify-center gap-2 px-3 py-2 rounded-lg bg-zinc-900 hover:bg-black text-white text-[13px] font-medium transition shadow-sm select-none" title="创建并切换到一个全新的会话">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 4v16m8-8H4" />
        </svg>
        <span>新建会话</span>
      </button>
    </div>

    <!-- Section: Recents / Sessions List -->
    <div class="px-3 pt-2 pb-1 flex items-center justify-between text-[11px] font-medium text-zinc-400 select-none">
      <span class="tracking-wide">会话列表</span>
      <button onclick="cleanEmptySessions()" class="hover:text-zinc-600 transition text-[10.5px]" title="一键清理无任务空会话">清理空会话</button>
    </div>
    <div id="sessionList" class="max-h-48 overflow-y-auto px-2 py-0.5 space-y-0.5 text-xs">
      <!-- Dynamic session items injected here -->
    </div>

    <!-- Section Divider & Header: Current Tasks -->
    <div class="px-3 pt-3 pb-1 flex items-center justify-between text-[11px] font-medium text-zinc-400 select-none border-t border-[#eaeaea] mt-1">
      <div class="flex items-center gap-1.5">
        <span class="tracking-wide">当前待办队列</span>
        <span id="taskCountBadge" class="text-[10px] px-1.5 py-0.2 rounded-full bg-zinc-200/70 text-zinc-600 font-mono font-medium">0</span>
      </div>
      <div id="taskQueueActions" class="flex items-center gap-2 text-[10.5px]">
        <button id="btnToggleSelectTasks" onclick="toggleTaskSelectMode()" class="hover:text-zinc-700 transition" title="多选删除任务">选择</button>
        <button id="btnClearTasks" onclick="clearAllTasks()" class="hover:text-zinc-700 transition" title="清空待办任务">清空</button>
      </div>
    </div>

    <!-- Task List (TASKS.txt) -->
    <div id="taskList" class="flex-1 overflow-y-auto px-2 py-1 space-y-1 text-xs">
      <div class="text-zinc-400 italic text-center py-6 text-[12px]">队列已空<br>等待新任务</div>
    </div>

    <!-- Bottom Profile & Workspace Footer -->
    <div class="border-t border-[#eaeaea] p-2.5 flex items-center justify-between bg-[#f9f9fb] text-xs">
      <div id="workspaceBtn" class="flex items-center gap-2 min-w-0 cursor-pointer hover:bg-zinc-200/60 p-1.5 rounded-md transition flex-1 mr-1" title="点击切换工作区路径">
        <div class="w-5 h-5 rounded-full bg-zinc-200 flex items-center justify-center text-[10px] text-zinc-600 shrink-0 font-medium">📁</div>
        <span id="workspacePath" class="truncate text-zinc-700 text-[11.5px] font-mono">加载中...</span>
      </div>
      <div class="flex items-center gap-1 shrink-0">
        <button id="btnChangeWorkspace" class="p-1 rounded text-zinc-400 hover:text-zinc-700 hover:bg-zinc-200/60 transition" title="更改工作区">
          <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        </button>
      </div>
    </div>
  </aside>

  <!-- Right Main Area (Pure White Background, Centered Column, Floating Input) -->
  <main class="flex-1 flex flex-col bg-white relative overflow-hidden h-full">
    
    <!-- Top Minimalist Bar (Codex Style) -->
    <header class="h-11 border-b border-[#f0f0f2] px-6 flex items-center justify-between shrink-0 bg-white select-none z-10">
      <!-- Session Title / Prompt snippet -->
      <div class="flex items-center gap-2.5 min-w-0 max-w-lg">
        <button id="activeSessionBadge" class="group text-[11px] font-mono px-2 py-0.5 rounded bg-zinc-100 hover:bg-zinc-200 active:bg-zinc-300 text-zinc-600 hover:text-zinc-900 border border-zinc-200 shrink-0 transition flex items-center gap-1 cursor-pointer select-none" title="点击复制会话 ID">
          <span id="activeSessionText">default</span>
          <svg class="w-3 h-3 text-zinc-400 group-hover:text-zinc-700 transition" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
          </svg>
        </button>
        <span id="activeTitle" class="text-[13.5px] font-medium text-zinc-800 truncate">默认会话</span>
      </div>

      <!-- Right Action Icons -->
      <div class="flex items-center gap-3 text-zinc-500 text-xs shrink-0">
        <div id="agentStatusBadge" class="flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-zinc-100 text-zinc-600 border border-zinc-200/80 transition-all duration-300 select-none" title="模型运行与等待状态">
          <span id="agentStatusDot" class="w-2 h-2 rounded-full bg-zinc-400"></span>
          <span id="agentStatusLabel">检测中...</span>
        </div>
        <button id="btnCopyPrompt" class="px-2.5 py-1 rounded-md hover:bg-zinc-100 hover:text-zinc-800 text-zinc-600 text-xs transition flex items-center gap-1.5 font-medium shrink-0 whitespace-nowrap" title="复制提示词">
          <span>📋 复制启动词</span>
        </button>
        <button id="btnClearResponse" class="p-1.5 rounded-md hover:bg-zinc-100 hover:text-zinc-800 text-zinc-400 transition shrink-0" title="清空汇报历史">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Scrollable Chat Stream (RESPONSE.md) -->
    <div id="responseScrollArea" class="flex-1 overflow-y-auto relative select-text">
      <!-- Centered Reading Column (max-w-[780px], ample bottom padding for floating input) -->
      <div id="responseContainer" class="max-w-[780px] w-full mx-auto px-6 pt-7 pb-48 codex-markdown">
        <div class="text-zinc-400 italic text-center py-20 text-sm">等待 6pro 产生第一阶段汇报...</div>
      </div>
    </div>

    <!-- Floating Codex Input Pill (Absolute at Bottom, Centered, Big Rounded Pill) -->
    <div class="absolute bottom-0 left-0 right-0 pointer-events-none flex justify-center px-4 pb-5 pt-10 bg-gradient-to-t from-white via-white/80 to-transparent z-20">
      <div class="pointer-events-auto w-full max-w-[780px] bg-white border border-zinc-200/90 rounded-[24px] shadow-[0_4px_24px_rgba(0,0,0,0.06),0_1px_3px_rgba(0,0,0,0.03)] px-4 py-2.5 flex flex-col gap-1.5 transition-all duration-150 focus-within:border-zinc-350 focus-within:shadow-[0_8px_30px_rgba(0,0,0,0.08)]">
        
        <!-- Image Preview Area -->
        <div id="imagePreviewArea" class="hidden flex items-center gap-2 pb-1.5 flex-wrap"></div>

        <!-- Textarea (随心输入) -->
        <textarea id="taskInput" rows="2" placeholder="随心输入新任务或向 6Pro 补充指令... (支持 Ctrl+V 粘贴图片，按 Enter 发送)" class="w-full bg-transparent border-none p-0 text-[14.5px] text-zinc-900 placeholder:text-zinc-400 focus:outline-none focus:ring-0 resize-none leading-relaxed min-h-[42px] max-h-36"></textarea>

        <!-- Bottom Row Inside Pill: Left Tools & Badges, Right Model & Send/Stop Button -->
        <div class="flex items-center justify-between pt-1 select-none">
          <!-- Left: + Button and Status Pill -->
          <div class="flex items-center gap-2">
            <input type="file" id="imageFileInput" accept="image/*" class="hidden" />
            <button id="btnAttach" class="w-7 h-7 rounded-full text-zinc-500 hover:bg-zinc-100 hover:text-zinc-800 flex items-center justify-center transition" title="上传本地图片">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M12 4v16m8-8H4" />
              </svg>
            </button>
            
            <!-- Exact Codex "完全访问" Orange Pill -->
            <div class="flex items-center gap-1.5 px-2 py-0.5 rounded-full bg-[#fef7ee] border border-[#fed7aa]/70 text-[11.5px] font-medium text-[#c2410c]" title="单轮多任务环境，自动复用会话">
              <svg class="w-3.5 h-3.5 text-[#ea580c]" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z" clip-rule="evenodd" />
              </svg>
              <span>完全访问 · 单轮复用</span>
            </div>

            <!-- Finish Turn Quick Action -->
            <button id="btnFinishTurn" class="text-[11.5px] text-zinc-400 hover:text-rose-600 px-2 py-0.5 rounded hover:bg-rose-50 transition" title="请求停止，等待执行端确认；不会强杀正在运行的命令">
              请求停止本轮
            </button>
          </div>

          <!-- Right: Model Indicator & Black Circular Button -->
          <div class="flex items-center gap-3">
            <div class="flex items-center gap-1.5 text-xs text-zinc-400 font-sans">
              <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
              <span>ChatGPT Web — High 轻度</span>
            </div>

            <!-- Native Codex Black Circle Send Button -->
            <button id="btnSendTask" class="w-8 h-8 rounded-full bg-zinc-900 hover:bg-black text-white flex items-center justify-center transition shadow-sm active:scale-95 disabled:opacity-40" title="发送 (Enter)">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 10l7-7m0 0l7 7m-7-7v18" />
              </svg>
            </button>
          </div>
        </div>

      </div>
    </div>

  </main>

  <script>
    marked.setOptions({ gfm: true, breaks: true });
    const elWorkspace = document.getElementById("workspacePath");
    const elSessionList = document.getElementById("sessionList");
    const elActiveSessionBadge = document.getElementById("activeSessionBadge");
    const elTaskList = document.getElementById("taskList");
    const elTaskBadge = document.getElementById("taskCountBadge");
    const elResponse = document.getElementById("responseContainer");
    const elResponseScrollArea = document.getElementById("responseScrollArea");
    const elInput = document.getElementById("taskInput");
    const btnSend = document.getElementById("btnSendTask");
    const btnClearTasks = document.getElementById("btnClearTasks");
    const btnClearResponse = document.getElementById("btnClearResponse");
    const btnChangeWs = document.getElementById("btnChangeWorkspace");
    const workspaceBtn = document.getElementById("workspaceBtn");
    const btnCopyPrompt = document.getElementById("btnCopyPrompt");
    const btnFinishTurn = document.getElementById("btnFinishTurn");
    const btnNewTurn = document.getElementById("btnNewTurn");
    const btnNewDraftChat = document.getElementById("btnNewDraftChat");
    const btnCreateSession = document.getElementById("btnCreateSession");
    const activeTitle = document.getElementById("activeTitle");

    let activeSessionId = localStorage.getItem("6pro_active_session") || "default";
    let isDraftNewSession = false;
    let lastEpoch = 0;
    let currentSessionsCache = [];
    let currentTasksCache = [];
    let currentTaskIdsCache = [];
    let currentResponseText = "";
    let lastResponseRenderKey = "";
    let isTaskSelectMode = false;
    let selectedTaskIndices = new Set();
    const sessionBus = window.BroadcastChannel ? new BroadcastChannel("6pro_session_bus") : null;

    // Auto-expand textarea height gracefully
    elInput.addEventListener("input", () => {
      elInput.style.height = "auto";
      elInput.style.height = Math.min(elInput.scrollHeight, 140) + "px";
    });

    async function apiFetch(url, options) {
      try {
        const response = await fetch(url, options);
        if (!response.ok) {
          const data = await response.clone().json().catch(() => ({}));
          throw new Error(data.error || `请求失败 (${response.status})`);
        }
        return response;
      } catch (error) {
        alert(error.message || "连接失败，请重试");
        throw error;
      }
    }

    // Model output and task text are untrusted: strip scripts/handlers from rendered markdown.
    function renderMarkdown(markdown) {
      const html = marked.parse(markdown);
      return window.DOMPurify ? DOMPurify.sanitize(html) : `<pre>${escapeHtml(markdown)}</pre>`;
    }

    function formatAssistantBody(text) {
      if (!text || !text.trim()) return "";
      const lines = text.split(/\r?\n/);
      const processedLines = [];

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();

        // 1. Command execution: 已运行 Get-Content...
        if (line.startsWith("已运行 ")) {
          const cmd = line.substring(4);
          processedLines.push(`\n<div class="codex-action-row"><svg class="w-4 h-4 text-zinc-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m7 10 3 2-3 2M13 14h4"/></svg><span>已运行 <code>${escapeHtml(cmd)}</code></span></div>\n`);
          continue;
        }

        // 2. File read: 已读取 TASKS.txt
        if (line.startsWith("已读取 ")) {
          const file = line.substring(4);
          processedLines.push(`\n<div class="codex-action-row"><svg class="w-4 h-4 text-zinc-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M16 13H8M16 17H8M10 9H8"/></svg><span>已读取 <code>${escapeHtml(file)}</code></span></div>\n`);
          continue;
        }

        // 3. Web search: 已搜索 ...
        if (line.startsWith("已搜索 ")) {
          const query = line.substring(4);
          processedLines.push(`\n<div class="codex-action-row"><svg class="w-4 h-4 text-zinc-400 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20M2 12h20"/></svg><span>已搜索 ${escapeHtml(query)}</span></div>\n`);
          continue;
        }

        processedLines.push(lines[i]);
      }

      return renderMarkdown(processedLines.join("\n"));
    }

    // Native Codex Tool Call, Stage Divider & User Message Formatter
    function renderCodexContent(rawMarkdown) {
      if (!rawMarkdown || !rawMarkdown.trim()) {
        return '<div class="text-zinc-400 italic text-center py-20 text-sm">等待 6pro 产生第一阶段汇报...</div>';
      }

      const sections = rawMarkdown.split(/(?=^###\s*(?:用户任务|阶段汇报))/m);
      const htmlParts = [];

      for (let index = 0; index < sections.length; index++) {
        const trimmed = sections[index].trim();
        if (!trimmed) continue;

        const match = trimmed.match(/^###\s*(用户任务|阶段汇报)\s*\[?([0-9:]*)\]?/);
        if (match) {
          const type = match[1];
          const time = match[2] || "";
          const body = trimmed.substring(match[0].length).trim();

          if (type === "用户任务") {
            let userPromptText = body;
            let accidentalModelReply = "";
            // The task service writes `<!-- task:ID -->`, the exact task text and a separate 阶段汇报
            // section, so a recorded task keeps its blank lines and is never split below.
            const recordedTask = index > 0 && /<!-- task:[a-zA-Z0-9_-]+ -->\s*$/.test(sections[index - 1]);

            // Compatibility check: Detect if model output was appended into the user task section without a divider
            // Case 1: Model echoed "用户任务：..." in its own response
            const matchModelEcho = !recordedTask && body.match(/^(.*?)(?:\r?\n){2,}(用户任务\s*[：:][\s\S]*)$/);
            if (matchModelEcho) {
              userPromptText = matchModelEcho[1].trim();
              accidentalModelReply = matchModelEcho[2].trim();
            } else if (!recordedTask) {
              // Case 2: Historical data where user prompt is short and followed by model response paragraphs
              const splitParts = body.split(/(?:\r?\n){2,}/);
              if (splitParts.length >= 2 && splitParts[0].length < 200 && splitParts.slice(1).join("\n\n").length > splitParts[0].length) {
                userPromptText = splitParts[0].trim();
                accidentalModelReply = splitParts.slice(1).join("\n\n").trim();
              }
            }

            const parsedBody = renderMarkdown(userPromptText);
            htmlParts.push(`
              <div class="codex-user-turn my-8 flex justify-end">
                <div class="max-w-[92%] sm:max-w-[85%] w-full bg-[#f4f4f6] border border-[#e4e4e7] rounded-2xl px-5 py-4 shadow-sm transition hover:border-[#d4d4d8]">
                  <div class="flex items-center justify-between gap-4 text-xs mb-2.5 pb-2 border-b border-zinc-200/70 font-sans">
                    <div class="flex items-center gap-2">
                      <div class="w-5 h-5 rounded-full bg-zinc-900 text-white flex items-center justify-center text-[10px] font-semibold shadow-xs">我</div>
                      <span class="font-medium text-zinc-800 text-[13px]">用户任务</span>
                    </div>
                    ${time ? `<span class="font-mono text-[11px] text-zinc-400 font-normal">${escapeHtml(time)}</span>` : ''}
                  </div>
                  <div class="codex-user-body text-[14.5px] text-zinc-800 leading-relaxed font-normal select-text">
                    ${parsedBody}
                  </div>
                </div>
              </div>
            `);

            if (accidentalModelReply) {
              htmlParts.push(formatAssistantBody(accidentalModelReply));
            }
            continue;
          }

          if (type === "阶段汇报") {
            const isPointer = /^(?:(?:Done|Step complete|阶段任务已完成)[,\s]*)?(?:see|详见)\s*(?:本地\s*)?RESPONSE\.md$/i.test(body.trim());
            if (isPointer) {
              // Omit redundant empty pointer card
              continue;
            }
            const divider = `
              <div class="codex-stage-divider">
                <svg class="w-3.5 h-3.5 text-zinc-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
                <span>阶段汇报 ${escapeHtml(time)}</span>
              </div>
            `;
            htmlParts.push(divider + formatAssistantBody(body));
            continue;
          }
        }

        htmlParts.push(formatAssistantBody(trimmed));
      }

      return htmlParts.join("\n");
    }

    function escapeHtml(str) {
      if (!str) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function fallbackCopyText(text) {
      const textArea = document.createElement("textarea");
      textArea.value = text;
      textArea.style.position = "fixed";
      textArea.style.top = "0";
      textArea.style.left = "0";
      textArea.style.width = "2em";
      textArea.style.height = "2em";
      textArea.style.padding = "0";
      textArea.style.border = "none";
      textArea.style.outline = "none";
      textArea.style.boxShadow = "none";
      textArea.style.background = "transparent";
      textArea.style.opacity = "0.01";
      textArea.setAttribute("readonly", "");
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      textArea.setSelectionRange(0, 99999);
      let successful = false;
      try {
        successful = document.execCommand('copy');
      } catch (err) {
        successful = false;
      }
      document.body.removeChild(textArea);
      return successful ? Promise.resolve() : Promise.reject(new Error('copy command failed'));
    }

    async function copyToClipboard(text) {
      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(text);
          return;
        } catch (e) {
          // fallback
        }
      }
      return fallbackCopyText(text);
    }

      document.body.appendChild(toast);

    let taskDeleteConfirmTimers = new Map();
    window.triggerDeleteTask = async function(taskId, btnEl) {
      if (!btnEl) return;
      if (btnEl.dataset.confirming === "true") {
        clearTimeout(taskDeleteConfirmTimers.get(taskId));
        taskDeleteConfirmTimers.delete(taskId);
        btnEl.disabled = true;
        btnEl.innerHTML = `<span class="text-[10px] text-zinc-400">⏳</span>`;
        try {
          await apiFetch("/api/delete-task", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ session_id: activeSessionId, id: taskId }),
          });
        } catch (e) {
          alert("删除任务失败: " + e.message);
        }
        return;
      }

      btnEl.dataset.confirming = "true";
      btnEl.innerHTML = `<span class="text-[10.5px] font-bold text-rose-600 bg-rose-50 px-1 py-0.5 rounded border border-rose-200 select-none">删除?</span>`;
      const timer = setTimeout(() => {
        btnEl.dataset.confirming = "false";
        btnEl.innerHTML = `🗑️`;
        taskDeleteConfirmTimers.delete(taskId);
      }, 3000);
      taskDeleteConfirmTimers.set(taskId, timer);
    };

    window.editTaskPrompt = async function(taskId, idx) {
      if (!currentTasksCache || idx < 0 || idx >= currentTasksCache.length) return;
      const currentTask = currentTasksCache[idx];
      const multiline = currentTask.includes("\n");
      const newTask = window.prompt(`修改待办任务 #${idx + 1}：${multiline ? "\n（多行任务在此编辑会合并为一行；如需保留换行，请删除后重新发送）" : ""}`, currentTask);
      if (newTask !== null && newTask.trim() && newTask.trim() !== currentTask) {
        try {
          await apiFetch("/api/update-task", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ session_id: activeSessionId, id: taskId, task: newTask.trim() }),
          });
        } catch (e) {
          alert("修改任务失败: " + e.message);
        }
      }
    };

    window.toggleTaskSelectMode = function(val) {
      isTaskSelectMode = (typeof val === "boolean") ? val : !isTaskSelectMode;
      selectedTaskIndices.clear();
      renderTaskList();
    };

    window.toggleTaskCheck = function(taskId) {
      if (selectedTaskIndices.has(taskId)) {
        selectedTaskIndices.delete(taskId);
      } else {
        selectedTaskIndices.add(taskId);
      }
      renderTaskList();
    };

    window.deleteSelectedTasks = async function() {
      if (selectedTaskIndices.size === 0) return;
      const count = selectedTaskIndices.size;
      if (confirm(`确认删除已勾选的 ${count} 项待办任务？`)) {
        try {
          await apiFetch("/api/delete-task", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ session_id: activeSessionId, ids: Array.from(selectedTaskIndices) }),
          });
          isTaskSelectMode = false;
          selectedTaskIndices.clear();
        } catch (e) {
          alert("批量删除任务失败: " + e.message);
        }
      }
    };

    window.clearAllTasks = async function() {
      if (confirm(`确认清空会话 [${activeSessionId}] 的待办任务？已经开始执行的任务不会被取消。`)) {
        await apiFetch("/api/clear-tasks", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: activeSessionId }),
        });
      }
    };

    function updateUI(data) {
      if (data.runtime) {
        let runtimePanel = document.getElementById("runtimeInfo");
        if (!runtimePanel) {
          runtimePanel = document.createElement("div");
          runtimePanel.id = "runtimeInfo";
          runtimePanel.className = "text-[11px] text-zinc-500 px-3 py-2 border-t border-zinc-200 break-words";
          elSessionList.parentElement.appendChild(runtimePanel);
        }
        const info = data.runtime;
        const buildLabel = info.gatewayBuild === "needs_build" ? "网关源码有更新，需要构建" : info.gatewayBuild === "built" ? "已发现网关构建产物" : "网关构建状态未知";
        runtimePanel.textContent = `任务服务 ${info.loadedRevision} · 启动于 ${new Date(info.startedAt).toLocaleString()} · ${buildLabel}${info.needsRestart ? " · 服务代码已更新，需要重启" : ""}`;
        const protocol = data.agentStatus?.gatewayProtocol;
        runtimePanel.textContent += protocol ? ` · 当前会话网关协议 ${protocol}` : " · 当前会话网关版本未确认";
        runtimePanel.title = info.gatewayBuildNote;
      }
      if (data.workspace) {
        elWorkspace.textContent = data.workspace;
      }

      if (data.sessions) {
        renderSessions(data.sessions);
      }

      if (isDraftNewSession) return;

      // Update badge and title
      const currentMeta = currentSessionsCache.find(s => s.id === activeSessionId);
      const elActiveSessionText = document.getElementById("activeSessionText");
      if (elActiveSessionText) {
        elActiveSessionText.textContent = activeSessionId;
      }

      if (data.tasks && data.tasks.length > 0) {
        activeTitle.textContent = `待办 (${data.tasks.length}): ${data.tasks[0]}`;
      } else {
        activeTitle.textContent = currentMeta ? currentMeta.name : (activeSessionId === "default" ? "默认会话" : activeSessionId);
      }

      // Update copy button text
      const sName = currentMeta ? currentMeta.name : (activeSessionId === "default" ? "默认会话" : activeSessionId);
      btnCopyPrompt.innerHTML = `<span>📋 复制【${escapeHtml(sName.slice(0, 10))}】启动词</span>`;

      // Render tasks in left sidebar
      const tasks = data.tasks || [];
      currentTasksCache = tasks;
      currentTaskIdsCache = data.taskIds || [];
      elTaskBadge.textContent = tasks.length;
      renderTaskList();

      // Update Agent Status Badge
      updateAgentStatusBadge(data.agentStatus);

      // Render response (SSE omits it when unchanged; keep the last copy)
      if (Object.prototype.hasOwnProperty.call(data, "response")) currentResponseText = data.response || "";
      const cardHtml = renderStatusCard(data.agentStatus);
      const responseRenderKey = `${activeSessionId}\u0000${currentResponseText}\u0000${cardHtml}`;
      if (responseRenderKey === lastResponseRenderKey) return;
      lastResponseRenderKey = responseRenderKey;
      const wasAtBottom = elResponseScrollArea.scrollHeight - elResponseScrollArea.scrollTop <= elResponseScrollArea.clientHeight + 100;
      let contentHtml = "";
      if (currentResponseText.trim()) {
        contentHtml = renderCodexContent(currentResponseText);
      } else {
        contentHtml = '<div class="text-zinc-400 italic text-center py-20 text-sm">等待 6pro 产生第一阶段汇报...</div>';
      }

      // Append real-time status card at bottom of conversation
      elResponse.innerHTML = contentHtml + cardHtml;

      elResponse.querySelectorAll('pre code').forEach((block) => {
        try { hljs.highlightElement(block); } catch {}
      });

      if (wasAtBottom) {
        elResponseScrollArea.scrollTop = elResponseScrollArea.scrollHeight;
      }
    }

    // Switch active session
    window.selectSession = async function(sessId) {
      if (isDraftNewSession) isDraftNewSession = false;
      activeSessionId = sessId;
      localStorage.setItem("6pro_active_session", sessId);
      connectSSE(sessId);
      try {
        await apiFetch("/api/sessions/switch", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessId }),
        });
        const res = await apiFetch(`/api/info?session_id=${encodeURIComponent(sessId)}`);
        const data = await res.json();
        if (res.ok && activeSessionId === sessId) updateUI(data);
      } catch {}
      if (sessionBus) sessionBus.postMessage({ type: "SESSION_SWITCHED", sessionId: sessId });
    };

    // Create and select new session immediately
    async function createAndSelectNewSession() {
      const newId = `sess_${Date.now().toString(36)}`;
      try {
        await apiFetch("/api/sessions/create", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: newId, name: newId }),
        });
        await selectSession(newId);
        elInput.focus();
      } catch (err) {
        alert("创建新会话失败: " + err.message);
      }
    }

    window.renameSessionPrompt = async function(id, oldName) {
      const newName = prompt("请输入新会话名称：", oldName);
      if (newName && newName.trim() && newName.trim() !== oldName) {
        const res = await apiFetch("/api/sessions/rename", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id, name: newName.trim() }),
        });
        const data = await res.json();
        if (data && data.sessions) {
          renderSessions(data.sessions);
        }
        if (activeSessionId === id) {
          activeTitle.textContent = newName.trim();
        }
      }
    };

    let deleteConfirmTimers = new Map();
    let deleteConfirmingIds = new Set();
    window.triggerDeleteSession = async function(id, btnEl) {
      if (!btnEl) return;
      if (deleteConfirmingIds.has(id)) {
        clearTimeout(deleteConfirmTimers.get(id));
        deleteConfirmTimers.delete(id);
        deleteConfirmingIds.delete(id);
        btnEl.disabled = true;
        btnEl.innerHTML = `<span class="text-[10px] text-zinc-400">⏳</span>`;
        try {
          const res = await apiFetch("/api/sessions/delete", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id }),
          });
          const data = await res.json();
          if (!res.ok || !data.success) throw new Error(data.error || "删除失败");
          if (data && data.sessions) {
            renderSessions(data.sessions);
          }
          if (activeSessionId === id) {
            const nextSession = (data.sessions && data.sessions.length > 0) ? data.sessions[0].id : "default";
            selectSession(nextSession);
          }
        } catch (e) {
          alert("删除失败: " + e.message);
        }
        return;
      }

      deleteConfirmingIds.add(id);
      btnEl.innerHTML = `<span class="text-[11px] font-bold text-rose-600 bg-rose-50 px-1 py-0.5 rounded border border-rose-200 select-none">确认?</span>`;

      const timer = setTimeout(() => {
        deleteConfirmingIds.delete(id);
        btnEl.innerHTML = "🗑️";
        deleteConfirmTimers.delete(id);
      }, 3500);
      deleteConfirmTimers.set(id, timer);
    };

    window.cleanEmptySessions = async function() {
      try {
        const res = await apiFetch("/api/sessions/clean-empty", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: "{}",
        });
        const data = await res.json();
        if (data && data.sessions) {
          renderSessions(data.sessions);
          if (!data.sessions.some(s => s.id === activeSessionId)) {
            selectSession(data.sessions.length > 0 ? data.sessions[0].id : "default");
          }
        }
      } catch {}
    };

    // SSE Connection for instant real-time updates
    let evtSource = null;
    function connectSSE(sessionId) {
      if (evtSource) {
        evtSource.close();
      }
      const source = new EventSource(`/api/events?session_id=${encodeURIComponent(sessionId)}`);
      evtSource = source;
      source.onmessage = (e) => {
        if (source !== evtSource) return;
        try {
          const data = JSON.parse(e.data);
          if (data.epoch && data.epoch < lastEpoch) return;
          if (data.activeSessionId && data.activeSessionId !== activeSessionId) {
            activeSessionId = data.activeSessionId;
            localStorage.setItem("6pro_active_session", activeSessionId);
            connectSSE(activeSessionId);
          }
          if (data.epoch) lastEpoch = data.epoch;
          updateUI(data);
        } catch {}
      };
    }
    connectSSE(activeSessionId);
    apiFetch("/api/sessions/switch", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: activeSessionId }),
    }).catch(() => {});

    // Send task
    let sendingTask = false;
    let pendingSubmission = null;
    async function submitTask() {
      const text = elInput.value.trim();
      if (!text || sendingTask) return;
      const sessionId = activeSessionId;
      if (!pendingSubmission || pendingSubmission.text !== text || pendingSubmission.sessionId !== sessionId) {
        pendingSubmission = { text, sessionId, id: crypto.randomUUID().replace(/-/g, "") };
      }
      sendingTask = true;
      btnSend.disabled = true;
      try {
        const response = await apiFetch("/api/add-task", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ task: text, session_id: sessionId, task_id: pendingSubmission.id }),
        });
        const data = await response.json();
        if (!data.success) { alert(data.error || "任务未入队"); return; }
        if (activeSessionId === sessionId && elInput.value.trim() === text) {
          elInput.value = "";
          elInput.style.height = "auto";
        }
        pendingSubmission = null;
      } catch { /* apiFetch displayed the error; preserve text and task ID for a safe retry. */ }
      finally { sendingTask = false; btnSend.disabled = false; }
    }

    btnSend.addEventListener("click", submitTask);
    elInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        submitTask();
      }
    });

    btnNewDraftChat.addEventListener("click", createAndSelectNewSession);

    // Clear buttons
    if (btnClearTasks) {
      btnClearTasks.addEventListener("click", clearAllTasks);
    }

    btnFinishTurn.addEventListener("click", async () => {
      if (confirm(`请求停止会话 [${activeSessionId}]？执行端将在下次领取任务时确认，当前命令可能继续执行，待办任务会保留。没有在线执行端时会立即停止。`)) {
        try {
          const res = await apiFetch("/api/add-task", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ task: "/exit", session_id: activeSessionId }),
          });
          const data = await res.json();
          showCopyToast(data.stopped ? "当前没有在线执行端，已直接停止" : "已请求停止，等待执行端确认");
        } catch {}
      }
    });

    window.resetWorker = async function() {
      if (!confirm(`重置会话 [${activeSessionId}] 的执行端？\n仅在原 turn 已确认中断时使用：未完成任务会退回队首，由下一个 turn 重新执行。`)) return;
      try {
        const res = await apiFetch("/api/sessions/reset-worker", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: activeSessionId }),
        });
        const data = await res.json();
        showCopyToast(data.requeuedTaskId ? "已重置，未完成任务已退回队首" : "已重置执行端");
      } catch {}
    };

    btnClearResponse.addEventListener("click", async () => {
      if (confirm(`确认清空会话 [${activeSessionId}] 的历史展示？已保存的任务结果仍保留。`)) {
        await apiFetch("/api/clear-response", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: activeSessionId }),
        });
      }
    });

    // Image upload & clipboard paste handling
    const elImageFileInput = document.getElementById("imageFileInput");
    const elImagePreviewArea = document.getElementById("imagePreviewArea");
    const btnAttach = document.getElementById("btnAttach");

    btnAttach.addEventListener("click", () => {
      elImageFileInput.click();
    });

    elImageFileInput.addEventListener("change", (e) => {
      if (e.target.files && e.target.files[0]) {
        uploadAndAttachImage(e.target.files[0]);
        elImageFileInput.value = "";
      }
    });

    // Window-level Paste event listener for screenshots / images
    window.addEventListener("paste", (e) => {
      const items = (e.clipboardData || window.clipboardData)?.items;
      if (!items) return;
      for (const item of items) {
        if (item.type && item.type.startsWith("image/")) {
          const file = item.getAsFile();
          if (file) {
            e.preventDefault();
            uploadAndAttachImage(file);
            break;
          }
        }
      }
    });

    async function uploadAndAttachImage(file) {
      const reader = new FileReader();
      reader.onload = async () => {
        const base64 = reader.result;
        const tempId = "img_" + Date.now();
        elImagePreviewArea.classList.remove("hidden");
        const badge = document.createElement("div");
        badge.id = tempId;
        badge.className = "flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-zinc-100 border border-zinc-200 text-xs text-zinc-700 animate-pulse";
        badge.innerHTML = `<span class="inline-block w-2 h-2 rounded-full bg-amber-500 animate-ping"></span><span>正在保存图片...</span>`;
        elImagePreviewArea.appendChild(badge);

        try {
          const res = await apiFetch("/api/upload-image", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              image: base64,
              session_id: activeSessionId,
              filename: file.name || "pasted_image.png"
            })
          });
          const data = await res.json();
          if (data.success && data.path) {
            badge.className = "flex items-center gap-2 px-2.5 py-1 rounded-lg bg-zinc-50 border border-zinc-200 text-xs text-zinc-700 shadow-sm";
            badge.innerHTML = `
              <img src="${base64}" class="w-5 h-5 rounded object-cover border border-zinc-300" />
              <span class="font-mono text-[11px] text-zinc-600 truncate max-w-[180px]">${data.filename}</span>
              <button class="text-zinc-400 hover:text-rose-600 font-bold ml-1" title="移除图片">&times;</button>
            `;
            badge.querySelector("button").onclick = () => {
              badge.remove();
              if (!elImagePreviewArea.children.length) elImagePreviewArea.classList.add("hidden");
              elInput.value = elInput.value.replace(`【图片: ${data.path}】`, "").trim();
            };

            const tag = `【图片: ${data.path}】`;
            if (!elInput.value.includes(data.path)) {
              elInput.value = (tag + " " + elInput.value).trim();
              elInput.focus();
            }
          } else {
            badge.remove();
            if (!elImagePreviewArea.children.length) elImagePreviewArea.classList.add("hidden");
            alert("图片上传失败: " + (data.error || "未知错误"));
          }
        } catch (err) {
          badge.remove();
          if (!elImagePreviewArea.children.length) elImagePreviewArea.classList.add("hidden");
          alert("图片处理失败: " + err.message);
        }
      };
      reader.readAsDataURL(file);
    }

    // Change workspace
    async function changeWorkspacePrompt() {
      const target = prompt("输入工作区文件夹绝对路径：", elWorkspace.textContent);
      if (target && target.trim()) {
        await apiFetch("/api/set-workspace", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ workspace: target.trim() }),
        });
      }
    }
    btnChangeWs.addEventListener("click", changeWorkspacePrompt);
    workspaceBtn.addEventListener("click", changeWorkspacePrompt);

    function buildSessionPrompt(sessionId) {
      const activeSessionId = sessionId;
      const currentMeta = (currentSessionsCache || []).find(s => s.id === sessionId);
      const sessionName = currentMeta ? currentMeta.name : (sessionId === "default" ? "默认会话" : sessionId);
      return `你当前已绑定本地会话【${sessionName}】（Session ID: ${activeSessionId}）。\n` +
        `请从当前工作区根目录或 sessions/${activeSessionId}/ 目录启动 CLI。目标会话：${activeSessionId}\n\n` +
        `【任务执行与协同规范】\n` +
        `1. 任务流转与状态同步：通过 MCP 工具 codex_fetch_next_task 与本地工作区保持同步。\n` +
        `   - 调用参数：必须传入 session_id="${activeSessionId}"，step_summary 仅传入简短状态标识（如 "Idle", "Poll", "Done"）。\n` +
        `2. 单次独立调用：每次由模型自身发起单次独立的工具调用，等待返回后再进行下一步。\n` +
        `3. 成果直接落盘：完成任务时使用 codex_fetch_next_task 的 task_id 和 response_text 提交成果，由服务端追加到绑定会话的 RESPONSE.md。\n` +
        `4. 持续协同监听：只要 has_next 为 true，在完成当前阶段任务并落盘后，请继续调用 codex_fetch_next_task 接收下一条指令。\n` +
        `5. 退出通道：当 codex_fetch_next_task 返回 has_next=false（用户输入 /exit）时，输出最终总结并结束本轮。\n` +
        `现在请调用 codex_fetch_next_task(session_id="${activeSessionId}", step_summary="Idle") 获取首个任务或进入待命状态。`;
    }

    // Copy Prompt (Session tailored)
    btnCopyPrompt.addEventListener("click", () => {
      const currentMeta = (currentSessionsCache || []).find(s => s.id === activeSessionId);
      const sessionName = currentMeta ? currentMeta.name : (activeSessionId === "default" ? "默认会话" : activeSessionId);
      const promptText = buildSessionPrompt(activeSessionId);
      copyToClipboard(promptText).then(() => {
        showCopyToast(`已复制【${sessionName.slice(0, 10)}】启动词`);
        const orig = btnCopyPrompt.innerHTML;
        btnCopyPrompt.innerHTML = `<span>✅ 已复制【${escapeHtml(sessionName.slice(0, 10))}】启动词</span>`;
        setTimeout(() => btnCopyPrompt.innerHTML = orig, 2500);
      }).catch(() => {
        window.prompt("请手动复制启动词：", promptText);
      });
    });

    // Click to copy session ID badge
    if (elActiveSessionBadge) {
      elActiveSessionBadge.addEventListener("click", () => {
        copyToClipboard(activeSessionId).then(() => {
          showCopyToast(`已复制会话 ID: ${activeSessionId}`);
          const elText = document.getElementById("activeSessionText");
          if (elText) {
            elText.textContent = "已复制 ✓";
            elActiveSessionBadge.classList.add("bg-emerald-50", "border-emerald-300", "text-emerald-700");
            setTimeout(() => {
              elText.textContent = activeSessionId;
              elActiveSessionBadge.classList.remove("bg-emerald-50", "border-emerald-300", "text-emerald-700");
            }, 1500);
          }
        }).catch(() => {
          window.prompt("请手动复制会话 ID：", activeSessionId);
        });
      });
    }

    if (sessionBus) {
      sessionBus.onmessage = (e) => {
        if (e.data && e.data.type === "SESSION_SWITCHED") {
          apiFetch(`/api/sessions`).then(r => r.json()).then(d => renderSessions(d.sessions));
        }
      };
    }
  </script>
</body>
</html>
