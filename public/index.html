<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>6Pro 额度复用助手</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    /* Custom scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #18181b; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #52525b; }

    /* Modern Dark Markdown Typography */
    .markdown-body {
      font-size: 15px;
      line-height: 1.75;
      color: #cbd5e1;
      letter-spacing: 0.012em;
    }
    .markdown-body h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #f8fafc;
      margin-top: 2rem;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #334155;
    }
    .markdown-body h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #f1f5f9;
      margin-top: 2.2rem;
      margin-bottom: 0.85rem;
      padding-left: 0.85rem;
      border-left: 4px solid #6366f1;
      line-height: 1.4;
      background: linear-gradient(90deg, rgba(99,102,241,0.12) 0%, transparent 70%);
      padding-top: 0.3rem;
      padding-bottom: 0.3rem;
      border-radius: 0 0.375rem 0.375rem 0;
    }
    .markdown-body h3 {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.82rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-weight: 600;
      color: #34d399;
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.25);
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      margin-top: 2.25rem;
      margin-bottom: 1rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }
    .markdown-body h3::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    .markdown-body p {
      margin-bottom: 1rem;
      line-height: 1.8;
      color: #e2e8f0;
    }
    .markdown-body strong, .markdown-body b {
      color: #fde047;
      font-weight: 600;
    }
    .markdown-body em, .markdown-body i {
      color: #93c5fd;
      font-style: italic;
    }
    .markdown-body :not(pre) > code {
      background: #1e1e24;
      color: #38bdf8;
      padding: 0.15rem 0.45rem;
      border-radius: 0.35rem;
      font-size: 0.88em;
      font-family: "JetBrains Mono", Consolas, Menlo, monospace;
      border: 1px solid #334155;
    }
    .markdown-body pre {
      background: #090d16 !important;
      border: 1px solid #1e293b;
      border-radius: 0.6rem;
      padding: 1.1rem 1.25rem;
      margin: 1.25rem 0;
      overflow-x: auto;
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    }
    .markdown-body pre code {
      color: #e2e8f0;
      font-family: "JetBrains Mono", Consolas, Menlo, monospace;
      font-size: 0.88rem;
      line-height: 1.65;
    }
    .markdown-body ul {
      list-style-type: disc;
      padding-left: 1.6rem;
      margin: 0.75rem 0 1.25rem 0;
    }
    .markdown-body ol {
      list-style-type: decimal;
      padding-left: 1.6rem;
      margin: 0.75rem 0 1.25rem 0;
    }
    .markdown-body li {
      margin-bottom: 0.45rem;
      color: #cbd5e1;
      line-height: 1.75;
    }
    .markdown-body blockquote {
      border-left: 4px solid #6366f1;
      background: rgba(99, 102, 241, 0.08);
      padding: 0.75rem 1.25rem;
      margin: 1.25rem 0;
      border-radius: 0 0.5rem 0.5rem 0;
      color: #94a3b8;
    }
    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.5rem 0;
      border-radius: 0.5rem;
      overflow: hidden;
      border: 1px solid #334155;
    }
    .markdown-body th {
      background: #1e293b;
      color: #f8fafc;
      font-weight: 600;
      padding: 0.65rem 0.9rem;
      text-align: left;
      border: 1px solid #334155;
    }
    .markdown-body td {
      padding: 0.6rem 0.9rem;
      border: 1px solid #1e293b;
      color: #cbd5e1;
    }
    .markdown-body tr:nth-child(even) {
      background: rgba(255, 255, 255, 0.02);
    }
    .markdown-body hr {
      border: 0;
      height: 1px;
      background: #334155;
      margin: 2.25rem 0;
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 flex flex-col h-screen overflow-hidden font-sans select-none">

  <!-- Top Header -->
  <header class="bg-zinc-900/90 border-b border-zinc-800 px-4 py-2.5 flex items-center justify-between backdrop-blur shrink-0">
    <div class="flex items-center gap-3">
      <div class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
      <span class="font-semibold text-sm tracking-wide text-zinc-100">6Pro 额度复用交互助手</span>
      <span class="text-xs px-2 py-0.5 rounded bg-zinc-800 text-zinc-400 border border-zinc-700">单轮多任务模式</span>
    </div>

    <!-- Workspace directory selector -->
    <div class="flex items-center gap-2 text-xs">
      <span class="text-zinc-500">工作区:</span>
      <span id="workspacePath" class="text-zinc-300 font-mono bg-zinc-800 px-2 py-1 rounded border border-zinc-700 max-w-xs truncate cursor-pointer hover:border-zinc-500" title="点击更改目录">加载中...</span>
      <button id="btnChangeWorkspace" class="px-2.5 py-1 rounded bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs border border-zinc-700 transition">更改</button>
      <button id="btnCopyPrompt" class="px-3 py-1 rounded bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs shadow transition flex items-center gap-1.5">
        <span>📋 复制启动词</span>
      </button>
    </div>
  </header>

  <!-- Main Split Layout -->
  <main class="flex-1 flex overflow-hidden">
    
    <!-- Left Sidebar: Task Queue (TASKS.txt) -->
    <aside class="w-80 border-r border-zinc-800 bg-zinc-900/40 flex flex-col shrink-0">
      <div class="p-3 border-b border-zinc-800 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="text-xs font-semibold text-zinc-300">待办任务队列</span>
          <span id="taskCountBadge" class="text-xs px-1.5 py-0.2 rounded-full bg-indigo-950 text-indigo-400 font-mono border border-indigo-800">0</span>
        </div>
        <button id="btnClearTasks" class="text-xs text-zinc-500 hover:text-zinc-300 transition">清空</button>
      </div>

      <!-- Task List Container -->
      <div id="taskList" class="flex-1 overflow-y-auto p-3 space-y-2 text-xs">
        <div class="text-zinc-600 italic text-center py-8">暂无待办任务<br>在底部直接输入添加</div>
      </div>

      <!-- Quick Hint -->
      <div class="p-3 bg-zinc-900/80 border-t border-zinc-800 text-[11px] text-zinc-500 leading-relaxed">
        💡 提示：在此添加任务，6pro 每完成一项会自动弹出下一项，全程在同一轮 6pro 对话中执行，不扣额外额度。
      </div>
    </aside>

    <!-- Right Content: Live AI Response (RESPONSE.md) -->
    <section class="flex-1 flex flex-col bg-zinc-950 overflow-hidden">
      <div class="p-3 border-b border-zinc-800 flex items-center justify-between bg-zinc-900/20">
        <div class="flex items-center gap-2">
          <span class="text-xs font-semibold text-zinc-300">AI 实时汇报流 (RESPONSE.md)</span>
          <span id="liveIndicator" class="text-[11px] text-emerald-400 flex items-center gap-1">
            <span class="inline-block w-1.5 h-1.5 rounded-full bg-emerald-400"></span> 实时同步中
          </span>
        </div>
        <button id="btnClearResponse" class="text-xs text-zinc-500 hover:text-zinc-300 transition">清空汇报</button>
      </div>

      <!-- Markdown Output Box -->
      <div id="responseContainer" class="flex-1 overflow-y-auto p-8 markdown-body select-text">
        <div class="text-zinc-600 italic text-center py-16">等待 6pro 产生第一阶段汇报...</div>
      </div>
    </section>

  </main>

  <!-- Bottom Input Bar -->
  <footer class="bg-zinc-900 border-t border-zinc-800 p-3 shrink-0">
    <div class="max-w-4xl mx-auto flex gap-2">
      <textarea id="taskInput" rows="2" placeholder="在此输入你的新任务或追问... (按 Enter 直接加入队列发送，Shift + Enter 换行)" class="flex-1 bg-zinc-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none focus:border-indigo-500 resize-none transition"></textarea>
      <button id="btnSendTask" class="px-5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm rounded-lg shadow transition flex items-center justify-center shrink-0">
        发送指令 (Enter)
      </button>
      <button id="btnFinishTurn" class="px-4 bg-zinc-800 hover:bg-rose-900/50 text-zinc-300 hover:text-rose-200 border border-zinc-700 text-xs rounded-lg transition shrink-0" title="发送 /exit 让 6pro 进行最终交付收尾">
        结束本轮 (/exit)
      </button>
    </div>
  </footer>

  <script>
    marked.setOptions({ gfm: true, breaks: true });
    const elWorkspace = document.getElementById("workspacePath");
    const elTaskList = document.getElementById("taskList");
    const elTaskBadge = document.getElementById("taskCountBadge");
    const elResponse = document.getElementById("responseContainer");
    const elInput = document.getElementById("taskInput");
    const btnSend = document.getElementById("btnSendTask");
    const btnClearTasks = document.getElementById("btnClearTasks");
    const btnClearResponse = document.getElementById("btnClearResponse");
    const btnChangeWs = document.getElementById("btnChangeWorkspace");
    const btnCopyPrompt = document.getElementById("btnCopyPrompt");

    // SSE Connection for instant real-time updates
    const evtSource = new EventSource("/api/events");
    evtSource.onmessage = (e) => {
      const data = JSON.parse(e.data);
      updateUI(data);
    };

    function updateUI(data) {
      if (data.workspace) {
        elWorkspace.textContent = data.workspace;
      }
      // Render tasks
      elTaskBadge.textContent = data.tasks.length;
      if (data.tasks.length === 0) {
        elTaskList.innerHTML = '<div class="text-zinc-600 italic text-center py-8">队列已空<br>等待新任务</div>';
      } else {
        elTaskList.innerHTML = data.tasks.map((task, idx) => `
          <div class="p-2.5 rounded bg-zinc-800/70 border border-zinc-700/60 flex items-start gap-2">
            <span class="font-mono text-zinc-500 text-[10px] mt-0.5">#${idx + 1}</span>
            <span class="flex-1 text-zinc-200 select-text leading-snug whitespace-pre-wrap">${escapeHtml(task)}</span>
          </div>
        `).join("");
      }

      // Render response
      if (data.response && data.response.trim()) {
        const wasAtBottom = elResponse.scrollHeight - elResponse.scrollTop <= elResponse.clientHeight + 80;
        elResponse.innerHTML = marked.parse(data.response);
        elResponse.querySelectorAll('pre code').forEach((block) => {
          try { hljs.highlightElement(block); } catch {}
        });
        if (wasAtBottom) {
          elResponse.scrollTop = elResponse.scrollHeight;
        }
      } else {
        elResponse.innerHTML = '<div class="text-zinc-600 italic text-center py-16">等待 6pro 产生阶段汇报...</div>';
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // Send task
    async function submitTask() {
      const text = elInput.value.trim();
      if (!text) return;
      elInput.value = "";
      await fetch("/api/add-task", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ task: text }),
      });
    }

    btnSend.addEventListener("click", submitTask);
    elInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        submitTask();
      }
    });

    // Clear buttons
    btnClearTasks.addEventListener("click", async () => {
      if (confirm("确认清空任务队列？")) {
        await fetch("/api/clear-tasks", { method: "POST" });
      }
    });

    const btnFinishTurn = document.getElementById("btnFinishTurn");
    btnFinishTurn.addEventListener("click", async () => {
      if (confirm("确认结束本轮会话并让 6pro 进行最终收尾交付？")) {
        await fetch("/api/add-task", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ task: "/exit" }),
        });
      }
    });

    btnClearResponse.addEventListener("click", async () => {
      if (confirm("确认清空历史汇报？")) {
        await fetch("/api/clear-response", { method: "POST" });
      }
    });

    // Change workspace
    btnChangeWs.addEventListener("click", async () => {
      const target = prompt("输入工作区文件夹绝对路径：", elWorkspace.textContent);
      if (target && target.trim()) {
        await fetch("/api/set-workspace", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ workspace: target.trim() }),
        });
      }
    });

    // Copy Prompt
    btnCopyPrompt.addEventListener("click", () => {
      const promptText = `请开始执行本地工作区任务。完成每个阶段后调用 codex_fetch_next_task 汇报进展并获取下一项，直到所有任务全部完成再交付。`;
      navigator.clipboard.writeText(promptText).then(() => {
        const orig = btnCopyPrompt.innerHTML;
        btnCopyPrompt.innerHTML = "<span>✅ 启动词已复制!</span>";
        setTimeout(() => btnCopyPrompt.innerHTML = orig, 2000);
      });
    });
  </script>
</body>
</html>
